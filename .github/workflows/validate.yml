name: Validate data
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1"   # weekly drift check on the published file (Monday, about 7am Pacific)
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python validate.py
  sources:
    # Code checks against the official lists themselves (UK, Canada, Australia, UN, EU, Federal Register,
    # EU Sanctions Map, World Bank, OpenSanctions, links). Errors block the merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python checks/check_sources.py ${{ github.event_name == 'schedule' && '--weekly' || '' }}
      - name: Weekly sanctions watch (opens an issue when the Federal Register has new OFAC or presidential sanctions items)
        if: always() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let w = [];
            try { w = JSON.parse(fs.readFileSync('checks/report.json', 'utf8')).watch || []; } catch (e) {}
            if (!w.length) return;
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
              title: "Sanctions watch: " + w.length + " new Federal Register item(s) to review",
              body: "New OFAC rules or notices, or presidential sanctions orders, published in the last 8 days. Check whether any adds, lifts or changes a country program on Country Check, above all the locked comprehensive embargoes (Cuba, Iran, North Korea, the occupied regions of Ukraine) in validate.py.\n\n" + w.map(x => "- " + x).join("\n")});
      - name: Proposer evidence (every changed value has a quote found word for word in its source)
        if: github.event_name == 'pull_request'
        run: python checks/check_evidence.py proposer origin/${{ github.base_ref }}
      - if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
              title: "Weekly source check found errors in the published data",
              body: "The weekly check of the published file against the official lists failed. See " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              labels: ["held"]});
  verifier-signoff:
    # Passes only when the independent verifier (a separate Claude task with its own context) has posted its
    # comment and every verdict is "confirmed" with a quote that code finds word for word in the source.
    # The verifier adds the label "verifier-done" after commenting, which re-runs this check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Data-only change
        # Changes to checks, workflows, procedure or anything else never publish automatically: Andrzej merges them himself.
        run: |
          other=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -v -E '^(country-check-data\.json|evidence/.*\.json)$' || true)
          if [ -n "$other" ]; then echo "Not a data-only change; needs Andrzej's merge:"; echo "$other"; exit 1; fi
      - name: Not held
        if: contains(github.event.pull_request.labels.*.name, 'held')
        run: echo "Held for Andrzej" && exit 1
      - name: Fetch pull request comments
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api --paginate repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments > comments.json
      - name: Verifier evidence
        run: python checks/check_evidence.py verifier origin/${{ github.base_ref }} comments.json
